[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-vla-rl"
version = "0.1.0"
description = "PPO flow fine-tuning of open-pi-zero in EmbodiedGen scenes with ALF"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "alf",
    "embodied-gen",
    "kincpp",
    "mani-skill[dependencies]",
    "ren-open-pi-zero",
    "colorlog==6.9.0",
    "dataclasses-json==0.6.7",
    "einops==0.8.1",
    "fast-simplification==0.1.13",
    "gsplat==1.5.3",
    "huggingface-hub==0.30.2",
    "hydra-core==1.3.2",
    "kaolin==0.18.0",
    "loguru==0.7.3",
    "moviepy==1.0.3",
    "ninja",
    "nvdiffrast",
    "omegaconf==2.3.0",
    "plyfile==1.1.2",
    "pyquaternion==0.9.9",
    "sapien==3.0.1",
    "sentencepiece==0.2.1",
    "setuptools<81",  # SAPIEN 3.0.1 imports pkg_resources.
    "shapely==2.1.1",
    "transformers==4.53.2",
    "transforms3d==0.4.2",
    "trimesh==4.6.8",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.environment" = ["assets/*.json"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
find-links = ["https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.7.1_cu128.html"]
# gym3's old upper bound on imageio-ffmpeg conflicts with newer imageio[ffmpeg].
override-dependencies = ["imageio-ffmpeg==0.5.1"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
alf = { path = "submodules/alf", editable = true }
embodied-gen = { path = "submodules/EmbodiedGen", editable = true }
kincpp = { path = "submodules/kincpp", editable = true }
mani-skill = { path = "submodules/ManiSkill", editable = true }
ren-open-pi-zero = { path = "submodules/ren_open_pi_zero", editable = true }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git", rev = "729261dc64c4241ea36efda84fbf532cc8b425b8" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
